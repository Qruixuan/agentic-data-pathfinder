[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder-minimal"
version = "0.1.0"
description = "Minimal causal access-response harness for Pathfinder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
flowmesh = [
    # Must match the deployed FlowMesh control plane (v0.1.8-rc.1).
    "flowmesh-sdk==0.1.8rc1",
    # Match the package baked into the deployed FlowMesh worker overlay.
    "mcp==1.28.1",
]

[project.scripts]
pathfinder = "pathfinder.cli:main"

[tool.setuptools.packages.find]
include = ["pathfinder*"]
