[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder-minimal"
version = "0.1.0"
description = "Minimal causal access-response harness for Pathfinder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
flowmesh = [
    "flowmesh-sdk==0.1.5",
    "mcp>=1.23.0",
]

[project.scripts]
pathfinder = "pathfinder.cli:main"

[tool.setuptools.packages.find]
include = ["pathfinder*"]
